<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>职位匹配报告</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f8fafc,#121923);--panel:light-dark(#fff,#1a2432);--ink:light-dark(#18283b,#e8eef7);--muted:light-dark(#506275,#a8b9cd);--line:light-dark(#dce4ed,#354459);--direct:light-dark(#137e64,#5bcbab);--transfer:light-dark(#3268b0,#7badf3);--limited:light-dark(#9a6710,#e4b763);--unknown:light-dark(#667387,#acb9cb)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1080px;margin:auto;padding:32px 24px 64px}h1{font-size:30px;margin:8px 0 12px}h2{font-size:22px;margin:30px 0 12px}h3{font-size:18px;margin:0}p{margin:8px 0}button,summary{font:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid var(--transfer);outline-offset:3px}.muted{color:var(--muted);font-size:14px}.tag{display:inline-block;border-radius:5px;padding:2px 9px;background:var(--bg);font-size:13px}.summary,.critical,.item,.condition{background:var(--panel);padding:18px 20px;border-radius:10px;margin:10px 0}.summary{border-left:4px solid var(--transfer)}.critical{border-left:4px solid var(--limited)}.critical-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.critical-list .critical{margin:0}.critical:has(details[open]){grid-column:1/-1}.tag{flex-shrink:0}.axes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.axis{font-size:14px}.axis strong{font-size:15px}.level-High{color:var(--direct)}.level-Limited{color:var(--limited)}.level-Unknown{color:var(--unknown)}.categories{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.category{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px;text-align:left;color:var(--ink)}.category[aria-pressed=true]{outline:2px solid var(--transfer)}.category .value{display:block;font-size:28px;font-weight:650;font-variant-numeric:tabular-nums}.category .count{font-size:14px;color:var(--muted)}.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.bar{height:18px;display:flex;border-radius:5px;overflow:hidden;background:var(--line)}.segment{height:100%;min-width:0}.direct{background:var(--direct)}.transfer{background:var(--transfer)}.limited{background:var(--limited)}.unknown{background:var(--unknown)}.group-title{margin-top:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.item summary,.critical summary{cursor:pointer;margin-top:12px;color:var(--transfer);font-size:14px}.item{border-left:3px solid var(--line)}.item-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.next{margin-top:10px;font-size:14px}.detail{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:14px}.quote{white-space:pre-wrap;border-left:2px solid var(--line);padding-left:12px;color:var(--muted)}.proof{margin:16px 0}.meta{overflow-wrap:anywhere;word-break:break-word;font-size:13px;color:var(--muted)}.action{padding:10px 0;border-bottom:1px solid var(--line)}.empty{padding:12px 0;color:var(--muted)}.show-all{background:none;border:0;color:var(--transfer);padding:6px 0;text-decoration:underline}.conditions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.conditions .condition{margin:0}.callout{border-left:3px solid var(--limited);padding-left:12px}.print-only{display:none}a{color:var(--transfer)}[hidden]{display:none!important}
@media(max-width:700px){main{padding:20px 14px 40px}h1{font-size:25px}.categories{grid-template-columns:repeat(2,minmax(0,1fr))}.axes,.conditions{grid-template-columns:1fr}.item-header{flex-direction:column;gap:5px}.critical-list{grid-template-columns:1fr}.summary,.critical,.item{padding:15px}}
@media print{body{background:white;color:black}main{padding:0}.categories{grid-template-columns:repeat(4,1fr)}.item,.critical,.summary{break-inside:avoid}.print-only{display:block}.category{border:1px solid #aaa}.show-all{display:none}}
</style>
</head>
<body>
<main>
<header><p class="muted" id="provenance-note"></p><h1 id="title"></h1><div class="summary"><strong id="priority"></strong><p id="decision"></p></div></header>
<section aria-labelledby="critical-heading"><h2 id="critical-heading">最重要的要求 · Critical</h2><p class="muted" id="critical-count"></p><div class="critical-list" id="critical"></div></section>
<section aria-labelledby="context-heading"><h2 id="context-heading">岗位画像与背景匹配</h2><p class="muted">独立于能力占比；工作性质不是职级排名，未知不等于不匹配。</p><div class="conditions" id="role-context"></div></section>
<section aria-labelledby="overview-heading"><h2 id="overview-heading">重要要求的证据支持分布</h2><p id="denominator"></p><div class="bar" role="img" id="bar"></div><div class="categories" id="categories"></div><p class="muted" id="count-note"></p><p class="muted">“有限”表示证据支持有限，不代表已证明能力低；可迁移路径仍需保留适用范围与核实事项。</p></section>
<section aria-labelledby="groups-heading"><div class="group-title"><h2 id="groups-heading">分类查看</h2><button type="button" class="show-all" id="show-all">查看全部要求</button></div><p class="muted" id="selection" aria-live="polite"></p><div id="groups"></div></section>
<section><h2>简历怎么调整</h2><p class="muted">这是调整建议；无草稿请求时不生成简历，也不自动确认事实。</p><div id="resume"></div></section>
<section><h2>其他要求与岗位条件</h2><div id="secondary"></div><div class="conditions" id="conditions"></div><h3 style="margin-top:20px">岗位风险</h3><div class="conditions" id="risks"></div></section>
<section><h2>接下来先确认什么</h2><ul id="checks"></ul><details><summary>职业发展判断与报告限制</summary><div id="limitations" class="detail"></div></details></section>
<footer><details><summary>来源与追溯记录</summary><div id="sources" class="detail"></div></details></footer>
</main>
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
(()=>{
'use strict';
const data=JSON.parse(document.getElementById('report-data').textContent);
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const pct=x=>x===null?'不适用':`${Number(x.toFixed(2))}%`;
const set=(id,text)=>document.getElementById(id).textContent=text;
set('title',`${data.title} · 职位匹配`);document.title=`${data.title} · 职位匹配`;
set('provenance-note',data.mode==='Preliminary'?'基于简历自述的初步分析 · 个人事实仍待本人确认':'基于已批准个人事实的匹配推断');
set('priority',`投递优先级：${data.priority}`);set('decision',data.decision.rationale);
const co=data.critical_overview;set('critical-count',`${co.total} 项关键要求；直接优势 ${co.groups[0].count} 项，可迁移路径 ${co.groups[1].count} 项，两侧支持有限 ${co.groups[2].count} 项，待核实 ${co.groups[3].count} 项。总览不能抵消关键缺口。`);
set('denominator',`统计范围：Critical＋Important，共 ${data.overview.total} 项能力要求。每项固定 ID 计数一次；不包含 Optional 和雇佣条件。`);set('count-note',data.count_note);
const bar=document.getElementById('bar');bar.setAttribute('aria-label',data.overview.groups.map(g=>`${g.label} ${g.count}/${g.denominator} ${pct(g.percentage)}`).join('；'));
for(const g of data.overview.groups){const s=node('span',undefined,`segment ${g.id}`);s.style.width=`${g.percentage||0}%`;bar.append(s);}
function axes(row){const box=node('div',undefined,'axes');for(const [name,label] of [['direct_support','直接支持'],['transfer_support','可迁移支持']]){const a=row[name];const col=node('div',undefined,'axis');col.append(node('strong',`${label} · ${data.level_labels[a.level]}`,`level-${a.level}`),node('p',a.reason));box.append(col);}return box;}
function proof(item){const box=node('div',undefined,'proof');box.append(node('strong',item.title),node('p',`${item.role} · ${item.period.map(x=>x||'未载明').join('—')}`,'meta'),node('p',`确认状态：${item.review==='approved'?'本人已确认':'待本人确认'} · 记录 ${item.ref}`,'meta'),node('p',`责任范围：${item.scope}`));box.append(node('p',item.original,'quote'));for(const [key,label] of [['situation','背景'],['task','责任'],['action','行动'],['result','结果']]){const star=item.star[key];if(!star)continue;const parts=[...new Set([...star.statements,...star.metric_refs.map(i=>item.metrics[i].quote)])];if(parts.length)box.append(node('p',`${label}：${parts.join('；')}`));if(star.unknowns.length)box.append(node('p',`待核实：${star.unknowns.join('；')}`,'muted'));}return box;}
function item(row,critical=false){const box=node('article',undefined,critical?'critical':'item');box.id=(critical?'critical-':'req-')+row.requirement_id;box.dataset.requirementId=row.requirement_id;const header=node('div',undefined,'item-header');header.append(node('h3',row.label),node('span',row.importance==='Critical'?'关键要求':row.importance==='Important'?'重要要求':row.importance==='Optional'?'补充要求':'重要性待核实','tag'));box.append(header,axes(row));if(row.next_check)box.append(node('p',`下一步：${row.next_check}`,'next'));const details=node('details');details.append(node('summary','查看原文、经历与迁移依据'));const full=node('div',undefined,'detail');full.append(node('p',`要求 ${row.requirement_id} · JD ${row.jd_item_ids.join("、")} · 综合分类 ${row.classification} · 判断性质 ${row.claim_status}`,'meta'),node('p',row.jd_text,'quote'),node('p',`为什么重要：${row.importance_reason}`));if(row.missing_dimensions.length)full.append(node('p',`仍缺少：${row.missing_dimensions.join('；')}`));if(row.transfer_support.mechanism)full.append(node('p',`迁移机制：${row.transfer_support.mechanism}`));if(row.transfer_support.limits.length)full.append(node('p',`迁移边界：${row.transfer_support.limits.join('；')}`));if(row.proofs.length)for(const e of row.proofs)full.append(proof(e));else full.append(node('p','当前没有可引用的贡献证据；不等于没有这项能力。'));details.append(full);box.append(details);return box;}
const critical=document.getElementById('critical');for(const r of data.critical)critical.append(item(r,true));if(!data.critical.length)critical.append(node('p','当前未识别到 Critical；需保留重要性未定事项。','empty'));
function contextSources(box,claims){const ids=[...new Set(claims.flatMap(c=>c.refs))];for(const id of ids)box.append(node('p',`${id}：${data.context_sources[id]}`,'quote'));}
for(const [key,label] of [['industry','行业相似性'],['business_scenario','业务场景相似性'],['work_nature','工作性质'],['people_management','是否带人']]){const comparison=key==='industry'||key==='business_scenario';const c=comparison?data.context_fit[key]:data.role_context[key];const box=node('article',undefined,'condition');box.dataset.contextKey=key;box.append(node('strong',`${label} · ${data.context_labels[c.classification]}`),node('p',comparison?c.rationale:c.text));const detail=node('details');detail.append(node('summary','查看判断依据与边界'));const body=node('div',undefined,'detail');body.append(node('p',`判断性质：${c.status}`,'meta'));if(comparison){const target=data.role_context[key];body.append(node('p',`目标背景：${target.text}`),node('p',`目标背景性质：${target.status}`,'meta'));for(const difference of c.differences)body.append(node('p',difference));contextSources(body,[target,{refs:c.target_refs}]);for(const ref of c.evidence_refs)body.append(proof(data.context_proofs[ref]));if(!c.evidence_refs.length)body.append(node('p','当前没有足以判断的个人背景证据；不代表能力低。'));}else{const claims=key==='work_nature'?[c,data.role_context.decision_rights,data.role_context.accountability]:[c];if(key==='work_nature'){body.append(node('p',`决策权限：${data.role_context.decision_rights.text}`),node('p',`结果／交付责任：${data.role_context.accountability.text}`));}contextSources(body,claims);}detail.append(body);box.append(detail);document.getElementById('role-context').append(box);}
let selected=null;
function groups(){const container=document.getElementById('groups');container.replaceChildren();set('selection',selected?`只显示 ${data.groups.find(g=>g[0]===selected)[1]}；上方 Critical 始终保留。`:'显示全部重要要求。点击占比卡片可按类别查看。');for(const [key,label,description] of data.groups){if(selected&&key!==selected)continue;const section=node('section');const rows=data.rows.filter(r=>r.group===key);section.append(node('h3',`${label} · ${rows.length} 项`),node('p',description,'muted'));for(const r of rows)section.append(item(r));if(!rows.length)section.append(node('p','当前没有此类要求。','empty'));container.append(section);}for(const b of document.querySelectorAll('.category'))b.setAttribute('aria-pressed',String(b.dataset.group===selected));}
for(const g of data.overview.groups){const b=node('button',undefined,'category');b.type='button';b.dataset.group=g.id;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',`${g.label}，${g.count}/${g.denominator}，${pct(g.percentage)}，点击查看`);const label=node('span');label.append(node('span',undefined,`swatch ${g.id}`),document.createTextNode(g.label));b.append(label,node('span',pct(g.percentage),'value'),node('span',`${g.count}/${g.denominator} 项`,'count'));b.addEventListener('click',()=>{selected=selected===g.id?null:g.id;groups();});document.getElementById('categories').append(b);}
document.getElementById('show-all').addEventListener('click',()=>{selected=null;groups();});groups();
for(const change of data.resume_changes){const box=node('div',undefined,'action');box.append(node('strong',change.priority),node('p',change.rationale));if(change.proposed_text)box.append(node('p',`建议表述（待确认）：${change.proposed_text}`));const details=node('details');details.append(node('summary','查看调整依据'),node('p',`要求：${change.requirement_ids.join('、')}；经历：${change.evidence_refs.map(ref=>data.rows.flatMap(r=>r.proofs).find(e=>e.ref===ref)?.title||ref).join('、')||'需要补材料'}`,'meta'));box.append(details);document.getElementById('resume').append(box);}
for(const row of data.secondary)document.getElementById('secondary').append(item(row));if(!data.secondary.length)document.getElementById('secondary').append(node('p','没有单列的 Optional 或重要性未定要求。','muted'));
for(const c of data.conditions){const box=node('article',undefined,'condition');box.append(node('p',c.interpretation));const detail=node('details');detail.append(node('summary','查看条件原文'),node('p',c.jd_text,'quote'));box.append(detail);document.getElementById('conditions').append(box);}if(!data.conditions.length)document.getElementById('conditions').append(node('p','截图未明确列出雇佣条件；未知不等于没有条件。','muted'));
const riskNames={Company:'公司',Employment:'雇佣性质',Ownership:'职责与权限',Longevity:'持续性'},riskLevels={Low:'低',Medium:'中',High:'高',Unknown:'待核实'};
for(const r of data.decision.risks){const box=node('article',undefined,'condition');box.append(node('strong',`${riskNames[r.dimension]} · ${riskLevels[r.level]}`),node('p',r.assessment.text));document.getElementById('risks').append(box);}
for(const text of data.decision.next_checks)document.getElementById('checks').append(node('li',text));
const limits=document.getElementById('limitations');limits.append(node('p',data.decision.career_value.assessment.text));for(const text of data.decision.limitations)limits.append(node('p',text));
const sources=document.getElementById('sources');sources.append(node('p',`运行 ${data.run_id} · 确定性校验通过，语义审核与本人事实批准独立。`,'meta'));for(const s of data.sources)sources.append(node('p',`${s.source_id}：${s.path}；SHA256 ${s.sha256}`,'meta'));for(const [k,v] of Object.entries(data.hashes))sources.append(node('p',`${k} hash：${v}`,'meta'));
window.careerReportReady=true;
})();
</script>
</body>
</html>
